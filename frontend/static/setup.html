<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <title>Configurazione iniziale · Gateway MQTT</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/font-awesome.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-body-tertiary">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-lg-5">
                        <header class="mb-4 text-center">
                            <h1 class="h3">Configurazione iniziale</h1>
                            <p class="text-muted mb-0">Crea un account amministratore e imposta i parametri del broker MQTT.</p>
                        </header>

                        <div id="setupAlert" class="alert d-none" role="alert"></div>

                        <form id="setupForm" class="row g-3">
                            <div class="col-12">
                                <h2 class="h5">Account amministratore</h2>
                            </div>
                            <div class="col-12 col-md-6">
                                <label for="adminEmail" class="form-label">Email amministratore</label>
                                <input type="email" class="form-control" id="adminEmail" placeholder="admin@example.com" required />
                            </div>
                            <div class="col-12 col-md-6">
                                <label for="adminPassword" class="form-label">Password</label>
                                <input type="password" class="form-control" id="adminPassword" placeholder="********" required />
                            </div>

                            <div class="col-12 pt-3">
                                <h2 class="h5">Broker MQTT</h2>
                            </div>
                            <div class="col-12 col-md-6">
                                <label for="mqttHost" class="form-label">Hostname / IP</label>
                                <input type="text" class="form-control" id="mqttHost" placeholder="mqtt.local" />
                            </div>
                            <div class="col-12 col-md-3">
                                <label for="mqttPort" class="form-label">Porta</label>
                                <input type="number" class="form-control" id="mqttPort" placeholder="1883" />
                            </div>
                            <div class="col-12 col-md-6">
                                <label for="mqttUsername" class="form-label">Username (opzionale)</label>
                                <input type="text" class="form-control" id="mqttUsername" />
                            </div>
                            <div class="col-12 col-md-6">
                                <label for="mqttPassword" class="form-label">Password (opzionale)</label>
                                <input type="password" class="form-control" id="mqttPassword" />
                            </div>
                            <div class="col-12 col-md-6">
                                <label for="mqttSubscribeTopic" class="form-label">Topic di subscribe</label>
                                <input type="text" class="form-control" id="mqttSubscribeTopic" placeholder="#" />
                                <small class="text-muted">Wildcard per i topic da ascoltare (es. # o ksenia2mqtt/#).</small>
                            </div>
                            <div class="col-12 col-md-6">
                                <label for="mqttPublishTopic" class="form-label">Topic di publish (default)</label>
                                <input type="text" class="form-control" id="mqttPublishTopic" placeholder="gateway/out" />
                            </div>

                            <div class="col-12 d-flex justify-content-end align-items-center pt-3">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fa-solid fa-floppy-disk me-1"></i> Salva configurazione
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/setup.js" type="module"></script>
</body>
</html>
